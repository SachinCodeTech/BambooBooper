<!DOCTYPE html>
<html lang="en" style="background:#071a0b;">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#071a0b"/>
  <title>Offline – Bamboo Booper</title>
  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #071a0b, #0e2d14);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
    }
    .container{ max-width: 360px; }
    .panda{
      font-size: 96px;
      margin-bottom: 20px;
      display: block;
      animation: bob 2s ease-in-out infinite;
    }
    @keyframes bob{
      0%,100%{ transform: translateY(0); }
      50%    { transform: translateY(-14px); }
    }
    h1{
      font-size: 24px;
      font-weight: 900;
      color: #7eed9a;
      margin-bottom: 12px;
    }
    p{
      font-size: 15px;
      line-height: 1.7;
      color: rgba(255,255,255,.75);
      margin-bottom: 28px;
    }
    .retry-btn{
      display: inline-block;
      padding: 15px 40px;
      background: linear-gradient(135deg, #3dba5e, #2d8f48);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(61,186,94,.4);
      transition: transform .12s;
    }
    .retry-btn:active{ transform: scale(.95); }
    .footer{
      margin-top: 36px;
      font-size: 12px;
      color: rgba(255,255,255,.4);
      letter-spacing: .3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="panda">🐼</span>
    <h1>No Internet Connection</h1>
    <p>Your panda needs a connection to load the bamboo forest.<br/>
       Please check your network and try again.</p>
    <button class="retry-btn" onclick="location.reload()">🔄 Retry</button>
    <div class="footer">Bamboo Booper v1.0 · CodeTech · Lead Developer: Sachin Sheth</div>
  </div>
</body>
</html>
